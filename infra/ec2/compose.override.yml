services:
  frontend:
    ports: !override
      - "127.0.0.1:6767:8080"

  caddy:
    image: caddy:2.11.7-alpine
    container_name: excalidash-caddy
    network_mode: host
    environment:
      EXCALIDASH_HOSTNAME: ${EXCALIDASH_HOSTNAME:?set EXCALIDASH_HOSTNAME}
      EXCALIDASH_BASIC_AUTH_USER: ${EXCALIDASH_BASIC_AUTH_USER:?set EXCALIDASH_BASIC_AUTH_USER}
      EXCALIDASH_BASIC_AUTH_HASH: ${EXCALIDASH_BASIC_AUTH_HASH:?set EXCALIDASH_BASIC_AUTH_HASH}
    volumes:
      - ./infra/ec2/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/caddy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
